[project]
name = "culture-agents"
version = "0.15.2"
description = "Control plane for AgentCulture agents: direct dispatch, sessions, and lifecycle (dispatch, attach, steer, delegate, cancel, resume, supervise) over harness adapters, independent of chat."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = [
    "agentfront>=0.22,<0.23",
    "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/agentculture/culture-agents"
Issues = "https://github.com/agentculture/culture-agents/issues"

[project.scripts]
agents = "culture_agents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["culture_agents"]

# The control-API schemas the CLI validates every core response against. They
# are copied into the wheel from the one copy in contract/ at build time (no
# second copy is kept in the tree). tests/test_contract_packaging.py fails when
# this list and contract/*.json differ.
[tool.hatch.build.targets.wheel.force-include]
"contract/agent.json" = "culture_agents/contract/agent.json"
"contract/allowlist.json" = "culture_agents/contract/allowlist.json"
"contract/api.json" = "culture_agents/contract/api.json"
"contract/capabilities.json" = "culture_agents/contract/capabilities.json"
"contract/common.json" = "culture_agents/contract/common.json"
"contract/control-action.json" = "culture_agents/contract/control-action.json"
"contract/error.json" = "culture_agents/contract/error.json"
"contract/event.json" = "culture_agents/contract/event.json"
"contract/run.json" = "culture_agents/contract/run.json"
"contract/session.json" = "culture_agents/contract/session.json"
"contract/version.json" = "culture_agents/contract/version.json"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    "pyyaml>=6.0",
]

[tool.coverage.run]
source = ["culture_agents"]
omit = ["culture_agents/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=culture_agents (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["culture_agents"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# The npm package in core/ carries the same version as this one. While it is
# still the 0.0.0 placeholder (before its first publish) the bump leaves it
# alone; once it holds the real version, every bump moves the files together.
[tool.version-bump]
placeholder = "0.0.0"

[[tool.version-bump.mirror]]
path = "core/package.json"
kind = "json"

[[tool.version-bump.mirror]]
path = "core/package-lock.json"
kind = "npm-lock"

[[tool.version-bump.mirror]]
path = "core/src/index.ts"
kind = "text"
pattern = 'export const version = "{version}";'
